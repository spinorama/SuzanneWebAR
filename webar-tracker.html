<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>WebAR Image Tracker</title>
<!-- A-Frame 1.3.0 is the version MindAR 1.2.5 targets. Newer A-Frame => black camera. Do NOT bump. -->
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0b0b0f;color:#eaeaf0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  #ui{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px;
    background:radial-gradient(120% 120% at 50% 0%,#161622 0%,#0b0b0f 70%)}
  #ui h1{font-size:20px;margin:0}
  #ui p{font-size:13px;line-height:1.5;color:#a9a9c0;max-width:340px;margin:0}
  #start{margin-top:6px;padding:14px 26px;border:0;border-radius:999px;font-size:16px;font-weight:700;
    color:#0b0b0f;background:linear-gradient(90deg,#ff2d80,#ff9f43);cursor:pointer}
  #start:active{transform:scale(.98)}
  #bar{width:260px;height:8px;border-radius:8px;background:#26263a;overflow:hidden;display:none}
  #bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2e86de,#10ac84)}
  #status{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;
    padding:7px 14px;border-radius:999px;background:#0009;font-size:12px;display:none;backdrop-filter:blur(6px)}
  .hint{font-size:11px;color:#6f6f88}
  /* Camera video sits behind; keep the GL canvas transparent so it shows through */
  a-scene, canvas.a-canvas{background:transparent !important; z-index:1 !important}
  /* Force MindAR's camera <video> to a full-screen background layer */
  video{position:fixed !important; top:0 !important; left:0 !important;
    width:100vw !important; height:100vh !important; object-fit:cover !important;
    z-index:0 !important; background:#000 !important}
  /* Debug */
  #dbgBtn{position:fixed;right:12px;bottom:12px;z-index:40;width:44px;height:44px;border:0;border-radius:50%;
    background:#000a;color:#fff;font-size:20px;display:none}
  #dbg{position:fixed;left:8px;right:8px;bottom:64px;z-index:40;max-height:45vh;overflow:auto;
    background:#000d;border:1px solid #333;border-radius:12px;padding:10px 12px;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;
    color:#c7f9cc;display:none;white-space:pre-wrap}
  #dbg b{color:#ffd32a}
</style>
</head>
<body>
  <div id="status"></div>
  <button id="dbgBtn" title="debug">🐞</button>
  <div id="dbg"></div>
  <div id="ui">
    <h1>📐 WebAR Image Tracker</h1>
    <p>Point your camera at the <b>printed tracker image</b>. A UV-grid model will lock onto it. Move the tracker and the model follows.</p>
    <button id="start">Start AR</button>
    <div id="bar"><i></i></div>
    <p class="hint">Requires camera access over <b>HTTPS</b>. Best on Chrome (Android) or Safari (iOS 15+).</p>
  </div>

const MTL_TEXT    = `newmtl monkey
Kd 0.8 0.8 0.8
Ka 0 0 0
Ks 0 0 0
d 1
illum 1

newmtl tracker
Kd 1 0 1
Ka 0 0 0
Ks 0 0 0
d 1
illum 1
`;

/* Any mesh/material whose name matches is HIDDEN in AR (your tracker plane). */
const HIDE_PATTERN = /tracker/i;
const MODEL_POSITION = "0 0 0.05";
const MODEL_ROTATION = "-90 0 0";
const MODEL_SCALE    = "0.5 0.5 0.5";

/* Force transparent clear EVERY frame — A-Frame's render loop otherwise resets
   the clear alpha to opaque each tick, which paints black over the camera video. */
AFRAME.registerComponent("transparent-clear", {
  init: function(){
    const r = this.el.renderer;
    if (r){ r.setClearColor(0x000000, 0); r.setClearAlpha(0); r.autoClear = true; }
    if (this.el.object3D) this.el.object3D.background = null;
    if (this.el.sceneEl && this.el.sceneEl.object3D) this.el.sceneEl.object3D.background = null;
  },
  tick: function(){
    const r = this.el.renderer;
    if (r) r.setClearAlpha(0);   // reassert transparency each frame
  }
});

const $ = s => document.querySelector(s);
const statusEl = $("#status");
let lastError = "(none)";
function setStatus(t){ statusEl.style.display="block"; statusEl.textContent=t; }

const objURL = URL.createObjectURL(new Blob([OBJ_TEXT], {type:"text/plain"}));
const mtlURL = URL.createObjectURL(new Blob([MTL_TEXT], {type:"text/plain"}));

function loadImage(src){
  return new Promise((res,rej)=>{ const i=new Image(); i.crossOrigin="anonymous";
    i.onload=()=>res(i); i.onerror=rej; i.src=src; });
}
async function ensureCompiler(){
  if (window.MINDAR && window.MINDAR.IMAGE && window.MINDAR.IMAGE.Compiler) return;
  await new Promise((res,rej)=>{ const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js";
    s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}
async function compileTracker(){
  await ensureCompiler();
  const img = await loadImage(TRACKER_IMG);
  const compiler = new window.MINDAR.IMAGE.Compiler();
  await compiler.compileImageTargets([img], (p)=>{ $("#bar>i").style.width = Math.round(p) + "%"; });
  const buffer = await compiler.exportData();
  return URL.createObjectURL(new Blob([buffer]));
}

/* Force the WebGL canvas to clear transparently so the camera video shows through. */
function makeTransparent(sceneEl){
  try{
    const r = sceneEl.renderer;
    if (r){ r.setClearColor(0x000000, 0); r.setClearAlpha(0); r.autoClearColor = true; }
    const c = sceneEl.canvas || document.querySelector("canvas.a-canvas");
    if (c) c.style.background = "transparent";
  }catch(e){ lastError = "transp: "+e.message; }
}

function onModelLoaded(e){
  const THREE = window.THREE;
  const root = (e.detail && e.detail.model) || e.target.getObject3D("mesh");
  if(!root){ setStatus("model load error"); return; }
  const tex = new THREE.TextureLoader().load(UVGRID);
  if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
  else if ("sRGBEncoding" in THREE) tex.encoding = THREE.sRGBEncoding;
  root.traverse(o=>{
    if(!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const label = (o.name||"") + " " + mats.map(m=>m && m.name || "").join(" ");
    if (HIDE_PATTERN.test(label)) { o.visible = false; return; }
    o.material = new THREE.MeshBasicMaterial({ map: tex });
  });
  setStatus("Model ready — point at the tracker");
}

function buildScene(mindURL){
  const scene = document.createElement("a-scene");
  scene.setAttribute("mindar-image",
    "imageTargetSrc: "+mindURL+"; autoStart: true; uiScanning: no; uiLoading: no; filterMinCF: 0.0001; filterBeta: 0.005; missTolerance: 5; warmupTolerance: 5");
  scene.setAttribute("color-space","sRGB");
  scene.setAttribute("renderer","colorManagement: true, physicallyCorrectLights: true, alpha: true");
  scene.setAttribute("vr-mode-ui","enabled: false");
  scene.setAttribute("device-orientation-permission-ui","enabled: false");
  scene.setAttribute("transparent-clear","");   // per-frame transparent clear

  const cam = document.createElement("a-camera");
  cam.setAttribute("position","0 0 0");
  cam.setAttribute("look-controls","enabled: false");
  scene.appendChild(cam);

  const anchor = document.createElement("a-entity");
  anchor.setAttribute("mindar-image-target","targetIndex: 0");

  const model = document.createElement("a-entity");
  model.setAttribute("obj-model","obj: "+objURL+"; mtl: "+mtlURL);
  model.setAttribute("position", MODEL_POSITION);
  model.setAttribute("rotation", MODEL_ROTATION);
  model.setAttribute("scale",    MODEL_SCALE);
  model.addEventListener("model-loaded", onModelLoaded);
  model.addEventListener("model-error", ()=>{ lastError="OBJ load error"; setStatus("could not load OBJ"); });
  anchor.appendChild(model);

  anchor.addEventListener("targetFound", ()=>setStatus("🎯 Tracker found"));
  anchor.addEventListener("targetLost",  ()=>setStatus("Searching for tracker…"));

  scene.addEventListener("loaded", ()=>makeTransparent(scene));
  scene.addEventListener("renderstart", ()=>makeTransparent(scene));
  scene.addEventListener("arReady", ()=>{ makeTransparent(scene); setStatus("Camera ready — point at the tracker"); });
  scene.addEventListener("arError", ()=>{ lastError="arError (browser/camera)"; setStatus("AR error — see 🐞"); });

  scene.appendChild(anchor);
  document.body.appendChild(scene);
  // extra safety: reassert transparency a moment after start
  setTimeout(()=>makeTransparent(scene), 1500);
}

/* -------------------- debug panel -------------------- */
function renderDebug(){
  const p = $("#dbg"); if (p.style.display==="none") return;
  const vids = [...document.querySelectorAll("video")];
  const v = vids[0];
  const canv = document.querySelector("canvas.a-canvas");
  const vs = v ? getComputedStyle(v) : null;
  const cs = canv ? getComputedStyle(canv) : null;
  const vr = v ? v.getBoundingClientRect() : null;
  const info = {
    "A-Frame": (window.AFRAME && AFRAME.version) || "?",
    "three r": (window.THREE && THREE.REVISION) || "?",
    "video els": vids.length,
    "video size": v ? (v.videoWidth+"x"+v.videoHeight) : "-",
    "video onscreen": vr ? (Math.round(vr.width)+"x"+Math.round(vr.height)+" @"+Math.round(vr.left)+","+Math.round(vr.top)) : "-",
    "video z/pos/op": vs ? (vs.zIndex+" / "+vs.position+" / "+vs.opacity) : "-",
    "video ready": v ? v.readyState : "-",
    "video paused": v ? v.paused : "-",
    "canvas z/op": cs ? (cs.zIndex+" / "+cs.opacity) : "-",
    "canvas size": canv ? (canv.width+"x"+canv.height) : "-",
    "last error": lastError,
  };
  let out = "";
  for (const k in info) out += "<b>"+k+":</b> "+info[k]+"\n";
  p.innerHTML = out;
}
$("#dbgBtn").addEventListener("click", ()=>{
  const p=$("#dbg"); p.style.display = p.style.display==="none"||!p.style.display ? "block":"none"; renderDebug();
});
setInterval(renderDebug, 800);

/* -------------------- start -------------------- */
$("#start").addEventListener("click", async ()=>{
  try{
    $("#start").disabled = true; $("#start").textContent = "Compiling tracker…";
    $("#bar").style.display = "block";
    const mindURL = await compileTracker();
    $("#ui").style.display = "none";
    $("#dbgBtn").style.display = "block";
    setStatus("Starting camera…");
    buildScene(mindURL);
  }catch(err){
    console.error(err); lastError = (err && err.message) || (""+err);
    $("#start").disabled = false; $("#start").textContent = "Start AR";
    setStatus("Error: "+lastError);
  }
});
</script>
